:root{

  --line:#31353B; --line-2:#3E434A;
  --berry:#E86B83; --berry-ink:#F08D9F; --berry-soft:#332026; --on-berry:#1A1013;

  --line:#31353B; --line-2:#3E434A;

}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding-left:20px;padding-right:20px;padding-bottom:80px}
a{color:var(--berry-ink)}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px;border-radius:3px}
h1,h2{margin:0;text-wrap:balance}

.backhome{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);text-decoration:none;white-space:nowrap;
  border:1px solid var(--line-2);border-radius:99px;padding:5px 11px;
  display:inline-flex;align-items:center;gap:6px;margin:34px 0 0;
  transition:color .15s,border-color .15s;
}
.backhome:hover{color:var(--ink);border-color:var(--ink-3)}
.mast{padding-block:18px 20px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between}
.mast h1{font-family:var(--display);font-size:clamp(30px,5.2vw,46px);font-weight:600;letter-spacing:-.02em;line-height:1.02}
.mast .sub{color:var(--ink-3);font-size:14.5px;max-width:54ch;margin:10px 0 0}
.stamp{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;flex-direction:column;gap:4px;text-align:right}
.stamp b{color:var(--ink);font-weight:500}

.tally{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;background:var(--surface);margin-top:22px;overflow:hidden}
.tally .cell{flex:1 1 130px;padding:12px 15px;border-right:1px solid var(--line)}
.tally .cell:last-child{border-right:0}
.tally .n{font-family:var(--mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.tally .n.due{color:var(--now)}
.tally .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(12px);padding-block:12px;border-bottom:1px solid var(--line);margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--berry);color:var(--on-berry);border-color:var(--berry)}
.search{flex:1 1 180px;min-width:140px;font:inherit;font-size:13.5px;padding:7px 12px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);color:var(--ink)}
.togg{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}

section{margin-top:38px}
.sec-head{display:flex;align-items:baseline;gap:11px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sec-head h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sec-head .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-note{color:var(--ink-3);font-size:13px;margin:8px 0 0}

.row{display:grid;grid-template-columns:24px 1fr;gap:11px;padding:14px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;align-items:start}
.row:hover{background:var(--surface)}
.row.s-now{border-left-color:var(--now)}
.row.s-soon{border-left-color:var(--soon)}
.row.s-past{opacity:.48}
.row.done{opacity:.4}
.row.done .title{text-decoration:line-through}
.tick{appearance:none;width:16px;height:16px;margin-top:3px;border:1.5px solid var(--line-2);border-radius:3px;background:var(--surface);cursor:pointer;position:relative;flex:0 0 auto}
.tick:checked{background:var(--ink);border-color:var(--ink)}
.tick:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(43deg)}
.title{font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.title .org{color:var(--ink-3);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2.5px 7px;border-radius:3px;background:var(--surface-2);color:var(--ink-2)}
.tag.when{background:var(--berry-soft);color:var(--berry-ink);font-weight:500}
.tag.due{background:transparent;border:1px solid var(--now);color:var(--now);font-weight:500;text-transform:uppercase}
.tag.src{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3)}
.tag.flyer{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.detail{font-size:14px;color:var(--ink-3);margin-top:7px}
.act{font-size:14px;color:var(--ink-2);margin-top:7px}
.act b{font-weight:600;color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px}
.links a{font-family:var(--mono);font-size:11px;letter-spacing:.03em;text-decoration:none;border-bottom:1px solid var(--line-2);padding-bottom:1px;word-break:break-word}
.links a:hover{border-bottom-color:var(--berry)}
.links a::before{content:"\2192\00a0"}
.empty{padding:24px 4px;color:var(--ink-3);font-size:14px}

footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
footer p{margin:0 0 8px;max-width:78ch}
footer b{color:var(--ink-2)}
@media(max-width:560px){
  .wrap{padding-left:16px;padding-right:16px}
  .tally .cell{flex-basis:50%;border-bottom:1px solid var(--line)}
  .stamp{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    +'<div><div class="title">'+esc(it.title)+(it.org?' <span class="org">· '+esc(it.org)+'</span>':'')+'</div>'
    +'<div class="meta">'
      +(s?'<span class="tag '+s.cls+'">'+s.t+'</span>':'')
      +(it.when?'<span class="tag when">'+esc(it.when)+'</span>':'')
      +'<span class="tag src">'+esc(it.src)+'</span>'
      +(it.flyer?'<span class="tag flyer">from a flyer</span>':'')
    +'</div>'
    +(it.detail?'<div class="detail">'+esc(it.detail)+'</div>':'')
    +(it.act?'<div class="act">'+it.act+'</div>':'')
    +(it.links&&it.links.length?'<div class="links">'+it.links.map(function(l){
        return '<a href="'+esc(l[1])+'" target="_blank" rel="noopener noreferrer">'+esc(l[0])+'</a>';}).join('')+'</div>':'')
    +'</div></div>';
}
function render(){
  var html="";
  SECTIONS.forEach(function(sec){
    if(filter!=="all" && filter!==sec.k) return;
    var items=ITEMS.filter(function(it){ return it.cat===sec.k && matches(it); });
    if(hideDone) items=items.filter(function(it){ return !doneSet.has(id(it)); });
    if(!items.length) return;
    items.sort(function(a,b){
      var da=dateOf(a), db=dateOf(b);
      var pa=status(a)==="past", pb=status(b)==="past";
      if(pa!==pb) return pa?1:-1;
      if(!da&&!db) return 0; if(!da) return 1; if(!db) return -1;
      return da-db;
    });
    html+='<section><div class="sec-head"><h2>'+sec.h+'</h2><span class="ct">'+items.length+'</span></div>'
       +(sec.note?'<p class="sec-note">'+sec.note+'</p>':'')
       +items.map(rowHTML).join('')+'</section>';
  });
  document.getElementById("board").innerHTML = html || '<div class="empty">Nothing matches that.</div>';
}
document.getElementById("chips").innerHTML = CATS.map(function(c){
  return '<button class="chip" data-c="'+c.k+'" aria-pressed="'+(c.k==="all")+'">'+c.label+'</button>';}).join('');
document.getElementById("chips").addEventListener("click", function(e){
  var b=e.target.closest("[data-c]"); if(!b) return;
  filter=b.dataset.c;
  Array.prototype.forEach.call(this.querySelectorAll(".chip"),function(x){x.setAttribute("aria-pressed", String(x.dataset.c===filter));});
  render();
});
document.getElementById("q").addEventListener("input", function(e){ query=e.target.value.trim().toLowerCase(); render(); });
document.getElementById("hideDone").addEventListener("change", function(e){ hideDone=e.target.checked; render(); });
document.getElementById("board").addEventListener("change", function(e){
  var t=e.target.closest(".tick"); if(!t) return;
  var k=t.closest(".row").dataset.k;
  if(t.checked) doneSet.add(k); else doneSet.delete(k);
  persist(); render();
});

var dueSoon = ITEMS.filter(function(it){ var n=days(dateOf(it)); return n!==null && n>=0 && n<=5; }).length;
var live = ITEMS.filter(function(it){ return status(it)!=="past"; }).length;
document.getElementById("tally").innerHTML =
  [[live,"live items"],[dueSoon,"due in 5 days",dueSoon>0],
   [ITEMS.filter(function(i){return i.cat==="club";}).length,"clubs"],
   [META.groups,"groups read"],[META.messages,"messages"]]
  .map(function(c){ return '<div class="cell"><div class="n'+(c[2]?' due':'')+'">'+c[0]+'</div><div class="k">'+c[1]+'</div></div>'; }).join('');

document.getElementById("stamp").innerHTML =
  '<span>Read <b>'+META.read+'</b></span><span><b>'+META.groups+'</b> groups · <b>'+META.flyers+'</b> flyers</span><span>Back to <b>'+META.back+'</b></span>';

document.getElementById("foot").innerHTML = META.footer;
render();
</script>
</body>
</html>
